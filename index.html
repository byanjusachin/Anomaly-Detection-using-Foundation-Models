<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anomaly Detection based on Foundation Models</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="anomaly-style.css">
</head>
<body class="mainBody">
  <header class="topHeader">
    <h1 class="heading1">Anamoly Detection using Foundation Models</h1>
    <p class="subText">Please write the prompt below.</p>
  </header>

  <main class="mainBox">
    <div class="inputGroup">
      <label for="input" class="label1"> </label>
      <textarea id="input" rows="6" class="textInput" placeholder="Please write the promt here"></textarea>
    </div>

    <div class="uploadGroup">
      <input type="file" id="file" class="fileBox" />
      <button id="checkBtn" class="checkBtn" disabled>Check</button>
    </div>

    <div id="loading" class="loadingBox hidden">
      <svg class="spinIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="circle1" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="circle2" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
      </svg>
      <span class="loadingText">Hold on...</span>
    </div>

    <div id="resultBox" class="resultBox hidden">
      <h2 class="resultTitle">Result</h2>
      <pre id="result" class="resultText"></pre>
    </div>

    <div id="errorBox" class="errorBox hidden">
      <h2 class="errorTitle">Oops!</h2>
      <p id="error" class="errorText"></p>
    </div>
  </main>

  <footer class="footer1">&copy; Anamoly Detection using Foundation Models, 2025</footer>
  <script src="anomaly-script.js"></script>
</body>
</html>
